name: Release
# Push a tag v<version> (matching package.json) to publish to npm and PyPI.
# Both use trusted publishing (OIDC), so there are no tokens to store or rotate:
#   npm:  each package trusts this repo and release.yml (npm trust github …). npm
#         only allows that once a package exists, so the first release can use a
#         short-lived granular token in the NPM_TOKEN secret instead; delete the
#         secret once trusted publishing is set up.
#   PyPI: a trusted publisher for this repo, release.yml and the "pypi"
#         environment, added on pypi.org (as a pending publisher before the first release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      check_trust:
        description: Only check that every npm package trusts this workflow (publishes nothing)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  trust:
    if: inputs.check_trust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/trust.mjs --check
  npm:
    if: ${{ !inputs.check_trust }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: node scripts/publish.mjs --provenance
        env:
          # The NPM_TOKEN secret for a first release; with no secret npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.AICMS }}
  pypi:
    if: ${{ !inputs.check_trust }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" sdk/python/pyproject.toml
      - run: python -m unittest discover -s tests -v
        working-directory: sdk/python
      - run: python -m pip install build && python -m build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true
